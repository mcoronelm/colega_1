<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUNDO ELE - Aprende Español</title>
  
  <!-- Fuentes extraídas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>

  </style>
</head>
<body>

  <!-- BANDERINES DE PAPEL PICADO -->
  <div class="banner">
    <div class="flag">¡HOLA!</div>
    <div class="flag">ELE</div>
    <div class="flag">CURSO</div>
    <div class="flag">NIÑOS</div>
    <div class="flag">JUEGA</div>
    <div class="flag">APRENDE</div>
  </div>

  <!-- HEADER -->
<header>
  <h1><a href="index.html" class="logo-link">MUNDO ELE</a></h1>
  <p>Aprende español de forma divertida 🌟</p>
</header>

  <!-- NAVBAR DE 6 UNIDADES CON DROPDOWN -->
  <!-- NAVBAR CONTENEDOR VACIÓ PARA IMPORTAR -->
<nav class="navbar" id="navbar-container"></nav>

  <!-- CONTENIDO PRINCIPAL (HOME) -->
<main>
  <section class="hero-card">
    <h2>¡Bienvenidos a Mundo ELE! 🎉</h2>
    <p>Selecciona una unidad en el menú para comenzar tu viaje de aprendizaje de español con juegos, ejercicios interactivos y muchas sorpresas.</p>
  </section>

  <!-- CARRUSEL DE VIDEOS INFANTILES -->
  <section class="video-carousel-section card">
    <h2>🎬 ¡Videos Divertidos para Aprender! 🌟</h2>
    
    <div class="carousel-container" id="videoCarousel">
      <div class="carousel-track">
        
        <!-- Video 1 -->
        <div class="carousel-slide active">
          <iframe src="https://www.youtube.com/embed/tgbNymZ7vqY" title="Video 1" allowfullscreen></iframe>
        </div>
        
        <!-- Video 2 -->
        <div class="carousel-slide">
          <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Video 2" allowfullscreen></iframe>
        </div>
        
        <!-- Video 3 -->
        <div class="carousel-slide">
          <iframe src="https://www.youtube.com/embed/L_LUpnjgPso" title="Video 3" allowfullscreen></iframe>
        </div>

        <!-- Video 4 -->
        <div class="carousel-slide">
          <iframe src="https://www.youtube.com/embed/3JZ_D3ELwOQ" title="Video 4" allowfullscreen></iframe>
        </div>

        <!-- Video 5 -->
        <div class="carousel-slide">
          <iframe src="https://www.youtube.com/embed/2Vv-BfVoq4g" title="Video 5" allowfullscreen></iframe>
        </div>

        <!-- Video 6 -->
        <div class="carousel-slide">
          <iframe src="https://www.youtube.com/embed/fJ9rUzIMcZQ" title="Video 6" allowfullscreen></iframe>
        </div>

      </div>

      <!-- Controles del Carrusel -->
      <button class="carousel-btn prev-btn" id="prevBtn">❮</button>
      <button class="carousel-btn next-btn" id="nextBtn">❯</button>

      <!-- Indicadores de puntos -->
      <div class="carousel-dots" id="carouselDots"></div>
    </div>
  </section>
</main>

  <!-- FOOTER (Estructura exacta solicitada) -->
<div id="footer-container"></div>

  <!-- SCRIPT PARA IMPORTAR LA NAVBAR E INICIALIZAR EVENTOS -->
<script>
  // Cargar Navbar
  fetch('navbar.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('navbar-container').innerHTML = data;
      
      // Activar comportamiento desplegable en dispositivos móviles
      const navItems = document.querySelectorAll('.nav-item');
      navItems.forEach(item => {
        const link = item.querySelector('.nav-link');
        if (link) {
          link.addEventListener('click', (e) => {
            if (window.innerWidth <= 768) {
              e.preventDefault();
              navItems.forEach(otherItem => {
                if (otherItem !== item) otherItem.classList.remove('active');
              });
              item.classList.toggle('active');
            }
          });
        }
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.nav-item')) {
          navItems.forEach(item => item.classList.remove('active'));
        }
      });
    })
    .catch(error => console.error('Error al cargar la navbar:', error));

  // Cargar Footer
  fetch('footer.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('footer-container').innerHTML = data;
    })
    .catch(error => console.error('Error al cargar el footer:', error));
</script>

  <!-- SCRIPT PARA INTERACCIÓN CLICK EN MÓVIL -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const navItems = document.querySelectorAll('.nav-item');

      navItems.forEach(item => {
        const link = item.querySelector('.nav-link');

        link.addEventListener('click', (e) => {
          // Detectar pantalla móvil
          if (window.innerWidth <= 768) {
            e.preventDefault();
            
            // Cerrar los otros menús
            navItems.forEach(otherItem => {
              if (otherItem !== item) {
                otherItem.classList.remove('active');
              }
            });

            // Alternar estado activo del clic
            item.classList.toggle('active');
          }
        });
      });

      // Cerrar menú desplegable al hacer clic fuera
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.nav-item')) {
          navItems.forEach(item => item.classList.remove('active'));
        }
      });
    });
  </script>

  <script>
  const slides = document.querySelectorAll('.carousel-slide');
  const dotsContainer = document.getElementById('carouselDots');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const carousel = document.getElementById('videoCarousel');

  let currentIndex = 0;
  let autoSlideTimer = null;
  let isUserInteracting = false;

  // 1. Crear los puntos de navegación dinámicamente
  slides.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = `dot ${i === 0 ? 'active' : ''}`;
    dot.onclick = () => {
      userInteracted();
      goToSlide(i);
    };
    dotsContainer.appendChild(dot);
  });

  const dots = document.querySelectorAll('.dot');

  // 2. Función para cambiar de slide
  function goToSlide(index) {
    slides[currentIndex].classList.remove('active');
    dots[currentIndex].classList.remove('active');

    currentIndex = (index + slides.length) % slides.length;

    slides[currentIndex].classList.add('active');
    dots[currentIndex].classList.add('active');
  }

  // 3. Pasar al siguiente slide
  function nextSlide() {
    goToSlide(currentIndex + 1);
  }

  // 4. Iniciar temporizador automático (cada 5s)
  function startAutoSlide() {
    if (!isUserInteracting) {
      autoSlideTimer = setInterval(nextSlide, 5000);
    }
  }

  // 5. Detener el carrusel cuando se interactúa
  function userInteracted() {
    isUserInteracting = true;
    clearInterval(autoSlideTimer);
  }

  // Eventos de botones prev/next
  nextBtn.addEventListener('click', () => {
    userInteracted();
    nextSlide();
  });

  prevBtn.addEventListener('click', () => {
    userInteracted();
    goToSlide(currentIndex - 1);
  });

  // Detener el auto-slide si el usuario hace click en el contenedor o reproduce un video
  carousel.addEventListener('click', userInteracted);
  carousel.addEventListener('touchstart', userInteracted);

  // Iniciar la rotación automática al cargar la página
  startAutoSlide();
</script>
</body>
</html>
